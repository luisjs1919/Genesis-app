<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Génesis POS — Sin conexión con PC Central</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 36px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.45);
    }
    h1 { font-size: 20px; margin: 0 0 12px; color: #38bdf8; }
    p { font-size: 14px; line-height: 1.6; color: #cbd5e1; margin: 0 0 18px; }
    code {
      display: block;
      background: #0f172a;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      color: #fbbf24;
      margin-bottom: 20px;
      word-break: break-all;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 11px 22px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No se pudo conectar con la PC Central de Génesis</h1>
    <p>Verifica que la PC principal esté encendida, que Génesis esté abierto en red y que ambas PC estén conectadas al mismo router o red local.</p>
    <code id="targetUrl">Cargando dirección configurada...</code>
    <button onclick="window.location.reload()">Reintentar conexión ahora</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const target = params.get('target') || 'http://192.168.1.50:3000';
    document.getElementById('targetUrl').textContent = 'Servidor configurado: ' + target;
    setTimeout(() => {
      window.location.href = target;
    }, 5000);
  </script>
</body>
</html>
